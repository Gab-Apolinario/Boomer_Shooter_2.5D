<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto Ragnarok — Ranking</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0D0808;
      color: #e0e0e0;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .rune-bar {
      font-size: 1.4rem;
      color: #00f0ff;
      letter-spacing: 0.6rem;
      text-shadow: 0 0 8px #00f0ff, 0 0 20px #00f0ff80;
      margin-bottom: 0.4rem;
    }

    .title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.6rem, 5vw, 2.8rem);
      font-weight: 900;
      color: #ff2200;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      text-shadow:
        0 0 10px #ff2200,
        0 0 30px #ff220080,
        0 0 60px #ff220040;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 0.8rem;
      color: #00f0ff;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      margin-top: 0.4rem;
      text-shadow: 0 0 8px #00f0ff80;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, #00f0ff, #ff4d1a, #00f0ff, transparent);
      margin: 1.5rem 0;
      box-shadow: 0 0 8px #00f0ff60;
    }

    .board-wrapper {
      border: 1px solid #00f0ff30;
      border-radius: 4px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px #ff4d1a20,
        inset 0 0 40px #00f0ff08,
        0 0 40px #00f0ff10;
    }

    .board-header {
      display: grid;
      grid-template-columns: 48px 1fr 120px 90px;
      padding: 0.7rem 1rem;
      background: linear-gradient(90deg, #1a0800, #0a1a1a);
      border-bottom: 1px solid #00f0ff40;
    }

    .board-header span {
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: #ff4d1a;
      text-shadow: 0 0 6px #ff4d1a80;
      text-transform: uppercase;
    }

    .board-header span:last-child,
    .board-header span:nth-child(3) {
      text-align: right;
    }

    .board-body {
      min-height: 120px;
    }

    .row {
      display: grid;
      grid-template-columns: 48px 1fr 120px 90px;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #ffffff08;
      transition: background 0.2s;
      align-items: center;
    }

    .row:last-child { border-bottom: none; }

    .row:hover {
      background: #00f0ff08;
    }

    .row.gold {
      background: #1a0f00;
      border-bottom-color: #ff8c0020;
    }

    .row.gold .rank {
      color: #ffcc00;
      text-shadow: 0 0 8px #ffcc00, 0 0 20px #ff880060;
      font-size: 1.1rem;
    }

    .row.gold .name {
      color: #ffcc00;
      text-shadow: 0 0 6px #ffcc0060;
    }

    .row.gold .score {
      color: #ffcc00;
      text-shadow: 0 0 8px #ffcc0080;
    }

    .row.silver .rank { color: #aad4ff; text-shadow: 0 0 6px #aad4ff60; }
    .row.silver .name { color: #aad4ff; }
    .row.silver .score { color: #aad4ff; text-shadow: 0 0 6px #aad4ff60; }

    .row.bronze .rank { color: #ff8844; text-shadow: 0 0 6px #ff884460; }
    .row.bronze .name { color: #ff8844; }
    .row.bronze .score { color: #ff8844; }

    .rank {
      font-family: 'Orbitron', monospace;
      font-size: 0.9rem;
      color: #ffffff40;
    }

    .name {
      font-size: 0.95rem;
      color: #c8e8ff;
      letter-spacing: 0.05em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-right: 0.5rem;
    }

    .score {
      text-align: right;
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      color: #00f0ff;
      text-shadow: 0 0 6px #00f0ff60;
    }

    .time {
      text-align: right;
      font-size: 0.8rem;
      color: #ffffff40;
    }

    .status {
      text-align: center;
      padding: 2rem;
      color: #ffffff30;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }

    .blink {
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.7rem;
      color: #ffffff20;
      letter-spacing: 0.15em;
    }

    .refresh-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      font-size: 0.7rem;
      color: #00f0ff40;
      letter-spacing: 0.1em;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #00f0ff;
      box-shadow: 0 0 4px #00f0ff;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="rune-bar">▸ ᚱ ᚨ ᚷ ᚾ ᚨ ᚱ ᛟ ◂</div>
      <div class="title">Projeto Ragnarok</div>
      <div class="subtitle">▸ ranking global ◂</div>
    </div>

    <div class="divider"></div>

    <div class="board-wrapper">
      <div class="board-header">
        <span>#</span>
        <span>Jogador</span>
        <span>Pontos</span>
        <span>Tempo</span>
      </div>
      <div class="board-body" id="board">
        <div class="status"><span class="blink">█</span> Conectando...</div>
      </div>
    </div>

    <div class="refresh-bar">
      <div class="dot"></div>
      <span id="refresh-label">atualizando a cada 30s</span>
    </div>

    <div class="footer">PUCPR · PUC GAME SHOW 2026 · ASTERA ESTÚDIO</div>
  </div>

  <script>
    const GAME_KEY    = "dev_f32a05e6adc24f2780cd43c7a3a1a20a";
    const LEADERBOARD = "ranking_pgs";
    const API         = "https://api.lootlocker.io";
    const COUNT       = 15;

    let sessionToken = null;

    async function startSession() {
      const res = await fetch(`${API}/game/v2/session/guest`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ game_key: GAME_KEY, game_version: "1.0.0" })
      });
      const data = await res.json();
      sessionToken = data.session_token || null;
      return !!sessionToken;
    }

    async function fetchBoard() {
      if (!sessionToken) {
        const ok = await startSession();
        if (!ok) { renderError("Falha ao conectar."); return; }
      }

      const res = await fetch(`${API}/game/leaderboards/${LEADERBOARD}/list?count=${COUNT}`, {
        headers: { "x-session-token": sessionToken }
      });

      if (res.status === 401) {
        sessionToken = null;
        fetchBoard();
        return;
      }

      const data = await res.json();
      render(data.items || []);
    }

    function render(items) {
      const board = document.getElementById("board");
      if (!items.length) {
        board.innerHTML = '<div class="status">Nenhuma pontuação registrada ainda.</div>';
        return;
      }

      const medals = ["gold", "silver", "bronze"];
      board.innerHTML = items.map((item, i) => {
        const cls = medals[i] || "";
        const name = (item.member_id || "???").substring(0, 20);
        const score = item.score.toLocaleString("pt-BR");
        let time = "--:--";
        const t = parseFloat(item.metadata);
        if (!isNaN(t)) {
          const m = String(Math.floor(t / 60)).padStart(2, "0");
          const s = String(Math.floor(t % 60)).padStart(2, "0");
          time = `${m}:${s}`;
        }
        return `<div class="row ${cls}">
          <span class="rank">${item.rank}</span>
          <span class="name">${name}</span>
          <span class="score">${score}</span>
          <span class="time">${time}</span>
        </div>`;
      }).join("");
    }

    function renderError(msg) {
      document.getElementById("board").innerHTML = `<div class="status">${msg}</div>`;
    }

    fetchBoard();
    setInterval(fetchBoard, 30000);
  </script>
</body>
</html>
