<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOMER_SHOOTER</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    @font-face {
    font-family: 'Gunbai';
    src: url('TemplateData/gunbai.ttf') format('truetype');
    font-weight: normal;
    }

    body {
      background: #0D0808;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #unity-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0D0808;
    }

    #unity-canvas {
      display: block;
    }

    /* Loading screen */
    #unity-loading-bar {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    #unity-loading-title {
      color: #DCC8C8;
      font-family: 'Gunbai', Impact, sans-serif;
      font-size: 62px;
      letter-spacing: 5px;
    }

    #unity-loading-red {
      color: #CC2200;
    }

    #unity-loading-subtitle {
      color: #6B4040;
      font-family: 'Gunbai', Arial, sans-serif;
      font-size: 18px;
      letter-spacing: 4px;
    }

    #unity-progress-bar-empty {
      width: 280px;
      height: 4px;
      background: #2E1212;
      border-radius: 3px;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: #CC2200;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    /* Warning banner */
    #unity-warning {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      color: #CC2200;
      font-family: Arial, sans-serif;
      font-size: 15px;
      text-align: center;
      white-space: nowrap;
      display: none;
    }

    /* Fullscreen button */
    #unity-footer {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 10;
    }

    #unity-fullscreen-button {
      cursor: pointer;
      width: 28px;
      height: 28px;
      opacity: 0.35;
      transition: opacity 0.2s;
    }

    #unity-fullscreen-button:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="unity-container">

    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-loading-title">
        PROJETO <span id="unity-loading-red">RAGNAROK</span>
      </div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-loading-subtitle">CARREGANDO...</div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-fullscreen-button" title="Tela cheia">
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 10V3H10" stroke="#DCC8C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 3H25V10" stroke="#DCC8C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M25 18V25H18" stroke="#DCC8C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 25H3V18" stroke="#DCC8C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

  </div>

  <script>
    var canvas        = document.getElementById("unity-canvas");
    var loadingBar    = document.getElementById("unity-loading-bar");
    var progressFull  = document.getElementById("unity-progress-bar-full");
    var fsButton      = document.getElementById("unity-fullscreen-button");
    var warningBanner = document.getElementById("unity-warning");

    // ---- resize: mantém 16:9 com letterbox ----
    function resizeCanvas() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var aspect = 16 / 9;
      var w, h;
      if (vw / vh > aspect) {
        h = vh; w = Math.round(h * aspect);
      } else {
        w = vw; h = Math.round(w / aspect);
      }
      canvas.style.width  = w + "px";
      canvas.style.height = h + "px";
    }

    window.addEventListener("resize", resizeCanvas);
    document.addEventListener("fullscreenchange", function () {
      setTimeout(resizeCanvas, 150);
    });
    resizeCanvas();

    // ---- Unity loader ----
    var buildUrl  = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";

    var config = {
      dataUrl:             buildUrl + "/WebGL.data",
      frameworkUrl:        buildUrl + "/WebGL.framework.js",
      codeUrl:             buildUrl + "/WebGL.wasm",
      streamingAssetsUrl:  "StreamingAssets",
      companyName:         "DefaultCompany",
      productName:         "BOOMER_SHOOTER",
      productVersion:      "0.1.0",
      showBanner: function (msg, type) {
        warningBanner.textContent   = msg;
        warningBanner.style.display = "block";
        if (type === "error") warningBanner.style.color = "#FF4400";
      },
    };

    // mobile: permite toque
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var m = document.createElement("meta");
      m.name    = "viewport";
      m.content = "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(m);
    }

    var script  = document.createElement("script");
    script.src  = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressFull.style.width = (100 * progress) + "%";
      })
      .then(function (unityInstance) {
        loadingBar.style.display = "none";

        fsButton.onclick = function () {
          unityInstance.SetFullscreen(1);
        };
      })
      .catch(function (msg) {
        alert(msg);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
